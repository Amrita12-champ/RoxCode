<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RoxCode</title>
    <link rel="stylesheet" href="css/reset-password.css">
</head>
<body>

<div class="reset-page">
    <div class="reset-card">
        <div class="brand">
            <div class="brand-icon">▦</div>
            <span>RoxCode</span>
        </div>

        <h1>Reset Password</h1>
        <p class="description">Create a new password for your account.</p>

        <!-- PURE HTML FORM SUBMISSION -->
        <form action="reset-password" method="post">
            <div class="input-box">
                <span class="input-icon">🔒</span>
                <input type="password" name="newPassword" placeholder="New password" required minlength="4">
            </div>

            <div class="input-box">
                <span class="input-icon">🔒</span>
                <input type="password" name="confirmPassword" placeholder="Confirm password" required minlength="4">
            </div>

            <button type="submit" class="reset-btn">Reset Password</button>
        </form>

        <div class="back-login">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
</div>

</body>
</html>
